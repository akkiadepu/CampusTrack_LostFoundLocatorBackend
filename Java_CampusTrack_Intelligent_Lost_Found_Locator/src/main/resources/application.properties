spring.application.name=Java_CampusTrack_Intelligent_Lost_Found_Locator

server.port=5000

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/lostfoundbd?createDatabaseIfNotExist=true
